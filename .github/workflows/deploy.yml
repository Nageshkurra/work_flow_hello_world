name: Windows Runner Test

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: non-prod

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ZIP
        shell: powershell
        run: |

          Compress-Archive `
            -Path .\* `
            -DestinationPath app.zip `
            -Force

      - name: Verify ZIP
        shell: powershell
        run: |

          Get-ChildItem app.zip

      - name: Authenticate SMB Share
        shell: powershell
        run: |

          net use \\172.31.15.241\D$ `
            /user:${{ secrets.WINDOWS_USERNAME }} `
            "${{ secrets.WINDOWS_PASSWORD }}"

      - name: Copy ZIP To Target Server
        shell: powershell
        run: |

          Copy-Item `
            -Path ".\app.zip" `
            -Destination "\\172.31.15.241\D$\deployments\app.zip" `
            -Force

      - name: Extract ZIP
        shell: powershell
        run: |

          Expand-Archive `
            -Path "\\172.31.15.241\D$\deployments\app.zip" `
            -DestinationPath "\\172.31.15.241\D$\services" `
            -Force

          Write-Host "Deployment Successful"

          Get-ChildItem "\\172.31.15.241\D$\deployments"
