name: Windows Runner Test

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ZIP
        shell: powershell
        run: |

          Compress-Archive `
            -Path .\* `
            -DestinationPath app.zip `
            -Force

      - name: Verify ZIP
        shell: powershell
        run: |

          Get-ChildItem app.zip

      - name: Authenticate SMB Share
        shell: powershell
        run: |

          net use \\172.31.17.82\D$ `
            /user:${{ secrets.WINDOWS_USERNAME }} `
            "${{ secrets.WINDOWS_PASSWORD }}"

      - name: Copy ZIP To Target Server
        shell: powershell
        run: |

          Copy-Item `
            -Path ".\app.zip" `
            -Destination "\\172.31.17.82\D$\deployments\app.zip" `
            -Force

      - name: Extract ZIP On Target Server
        shell: powershell
        run: |

          Invoke-Command `
            -ComputerName 172.31.17.82 `
            -ScriptBlock {

              Expand-Archive `
                -Path "D:\deployments\app.zip" `
                -DestinationPath "D:\deployments\current" `
                -Force

              Write-Host "Deployment Successful"

              Get-ChildItem "D:\deployments\current"

          }
